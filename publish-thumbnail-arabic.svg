<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Arabic cybersecurity thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="78%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="22%" cy="78%" r="38%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glowBlue)"/>
  <rect width="1280" height="720" fill="url(#glowGreen)"/>

  <!-- abstract laptop -->
  <g transform="translate(760 300)" opacity="0.95">
    <rect x="-170" y="0" width="340" height="210" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="-145" y="24" width="290" height="162" rx="6" fill="#020617"/>
    <g stroke="#22c55e" stroke-width="2" opacity="0.85">
      <line x1="-120" y1="60" x2="110" y2="60"/>
      <line x1="-120" y1="90" x2="60" y2="90"/>
      <line x1="-120" y1="120" x2="135" y2="120"/>
      <line x1="-120" y1="150" x2="20" y2="150"/>
    </g>
    <rect x="-205" y="210" width="410" height="16" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- glowing lock -->
  <g transform="translate(1080 190)" filter="url(#textGlow)">
    <rect x="-50" y="-15" width="100" height="95" rx="16" fill="none" stroke="#38bdf8" stroke-width="5"/>
    <path d="M -30 -15 V -45 A 30 30 0 0 1 30 -45 V -15" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="30" r="9" fill="#22c55e"/>
  </g>

  <!-- Arabic text -->
  <g font-family="'Segoe UI', Tahoma, sans-serif" text-anchor="end" direction="rtl" unicode-bidi="bidi-override" filter="url(#textGlow)">
    <text x="620" y="245" font-size="92" font-weight="800" fill="#f8fafc">الاختراق الأخلاقي</text>
    <text x="620" y="355" font-size="128" font-weight="900" fill="#38bdf8">ابدأ رحلتك</text>
    <text x="620" y="430" font-size="46" font-weight="600" fill="#cbd5e1">دورة Cyber Security بالعربية</text>
  </g>

  <!-- badge -->
  <g transform="translate(1120 620)">
    <rect x="-150" y="-34" width="300" height="68" rx="34" fill="url(#badge)" opacity="0.95"/>
    <text x="0" y="11" font-family="'Segoe UI', Tahoma, sans-serif" font-size="30" font-weight="800" fill="#050816" text-anchor="middle">ETHICAL HACKING 101</text>
  </g>

  <text x="60" y="670" font-family="'Segoe UI', Tahoma, sans-serif" font-size="26" font-weight="600" fill="#94a3b8" text-anchor="start">by AI YouTube SaaS</text>
</svg>